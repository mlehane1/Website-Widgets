<!DOCTYPE html>
<!--
  ============================================================
  F3 NATION OPEN Qs
  ============================================================
  Upcoming workouts that still need a Q, pulled live from the
  F3 Nation API. Each one has a "Take this Q" button: the PAX
  signs in with Slack, and if they are in this region's Slack
  they are signed up as Q in F3 Nation on the spot.

  HOW TO USE
  ----------
     /open-qs.html?regionOrgId=25273&title=F3%20Waxhaw
  Optional params:
     &days=21                         (how far ahead, default 14)
     &siteUrl=https://your-site.com   (footer link)

  The button only appears once the region is switched on in
  Netlify (see the "Take this Q" section of the README). Until
  then the page still lists the open Qs, with a note to sign
  up in Slack.

  No API token is needed in this file. It is safe to share
  publicly.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F3 Open Qs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #e5e5e5;
  color: #111;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 60px;
  -webkit-font-smoothing: antialiased;
}
.f3o-wrap { width: 100%; max-width: 560px; min-width: 0; }

.f3o-hdr { background: #111; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
.f3o-hdr-mark { width: 44px; height: 44px; flex-shrink: 0; object-fit: contain; background: #fff; border-radius: 3px; padding: 2px; }
.f3o-hdr-text { flex: 1; min-width: 0; }
.f3o-hdr-name { font-size: 17px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; }
.f3o-hdr-tag { font-size: 10px; color: #aaa; letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
.f3o-band { background: #c8102e; color: #fff; padding: 10px 20px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

.f3o-note { background: #fff8e1; border: 1px solid #f0d58a; color: #5a4300; font-size: 13px; padding: 10px 14px; margin-top: 14px; }

.f3o-day { margin-top: 18px; }
.f3o-dayname { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #555; margin-bottom: 8px; }

.f3o-row {
  background: #fff;
  border: 1px solid #ddd;
  border-left: 4px solid #c8102e;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.f3o-time { font-weight: 800; font-size: 15px; flex: 0 0 64px; }
.f3o-info { flex: 1; min-width: 0; }
.f3o-ao { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; }
.f3o-sub { font-size: 12px; color: #666; margin-top: 2px; overflow-wrap: anywhere; }

.f3o-take {
  flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 0 12px;
  border-radius: 8px;
  background: #c8102e; color: #fff;
  font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  text-decoration: none; white-space: nowrap;
}
.f3o-take:hover { background: #a50d24; }

.f3o-msg { background: #fff; border: 1px solid #ddd; padding: 24px 20px; font-size: 15px; color: #444; text-align: center; margin-top: 14px; }
.f3o-msg.err { color: #a50d24; }
.f3o-foot { margin-top: 20px; font-size: 12px; color: #666; text-align: center; }
.f3o-foot a { color: #c8102e; }

@media (max-width: 380px) {
  .f3o-row { flex-wrap: wrap; }
  .f3o-take { width: 100%; }
}
</style>
</head>

<script>
(function () {
  var P = new URLSearchParams(location.search);
  var RID = P.get('regionOrgId') || 25273;
  var DAYS = Math.min(Math.max(parseInt(P.get('days'), 10) || 14, 1), 60);
  var TITLE = P.get('title') || '';
  var SITE = P.get('siteUrl') || 'https://f3nation.com';
  var FN = location.origin + '/.netlify/functions/';
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function to12(t) {
    var s = String(t || '').replace(':', '');
    if (!/^\d{4}$/.test(s)) return t || '';
    var h = +s.slice(0, 2), ap = h >= 12 ? 'pm' : 'am';
    return (h % 12 || 12) + ':' + s.slice(2) + ap;
  }
  function ymd(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function dayLabel(d) {
    var dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }

  $('f3o-foot').innerHTML = '<a href="' + esc(SITE) + '">' + esc(SITE.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a> · Data: F3 Nation';

  var today = new Date();
  var from = ymd(today);
  var until = new Date(today); until.setDate(until.getDate() + DAYS);
  var to = ymd(until);
  var ret = location.pathname + location.search;

  Promise.all([
    fetch(FN + 'region-schedule?regionOrgId=' + encodeURIComponent(RID)).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
    }),
    fetch(FN + 'q-take?check=1&regionOrgId=' + encodeURIComponent(RID))
      .then(function (r) { return r.ok ? r.json() : { enabled: false }; })
      .catch(function () { return { enabled: false }; })
  ]).then(function (res) {
    var events = (res[0].events || []).filter(function (e) {
      return !e.plannedQs && e.seriesException !== 'closed' && e.startDate >= from && e.startDate <= to;
    });
    var canTake = !!res[1].enabled;

    var name = TITLE || 'F3 Open Qs';
    $('f3o-title').textContent = name;
    document.title = name + ' · Open Qs';
    $('f3o-band').textContent = events.length + ' open Q' + (events.length === 1 ? '' : 's') + ' · next ' + DAYS + ' days';

    if (!canTake) {
      $('f3o-note').innerHTML = '<div class="f3o-note">To take one of these, sign up as Q in your region\'s Slack.</div>';
    }
    if (!events.length) {
      $('f3o-list').innerHTML = '<div class="f3o-msg">Every workout in the next ' + DAYS + ' days has a Q. 💪</div>';
      return;
    }

    var byDay = {};
    events.forEach(function (e) { (byDay[e.startDate] = byDay[e.startDate] || []).push(e); });

    $('f3o-list').innerHTML = Object.keys(byDay).sort().map(function (d) {
      var rows = byDay[d].sort(function (a, b) { return String(a.startTime).localeCompare(String(b.startTime)); }).map(function (e) {
        var ao = e.orgName || e.name;
        var sub = [e.name && e.name !== ao ? e.name : '', (e.eventTypes || []).map(function (t) { return t.name; }).join(', ')]
          .filter(Boolean).join(' · ');
        var btn = canTake
          ? '<a class="f3o-take" href="' + esc(FN + 'q-take?eventInstanceId=' + e.id + '&regionOrgId=' + encodeURIComponent(RID) + '&ret=' + encodeURIComponent(ret)) + '">Take this Q</a>'
          : '';
        return '<div class="f3o-row"><div class="f3o-time">' + esc(to12(e.startTime)) + '</div>'
          + '<div class="f3o-info"><div class="f3o-ao">' + esc(ao) + '</div>' + (sub ? '<div class="f3o-sub">' + esc(sub) + '</div>' : '') + '</div>'
          + btn + '</div>';
      }).join('');
      return '<div class="f3o-day"><div class="f3o-dayname">' + esc(dayLabel(d)) + '</div>' + rows + '</div>';
    }).join('');
  }).catch(function (err) {
    $('f3o-band').textContent = 'Error';
    $('f3o-list').innerHTML = '<div class="f3o-msg err">Could not load the schedule: ' + esc(err.message) + '</div>';
  });
})();
</script>
</body>
